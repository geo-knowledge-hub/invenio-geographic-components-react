[metadata]
name = invenio-geographic-components
version = attr: invenio_geographic_components.__version__
description = Geographic components for InvenioRDM.
long_description = file: README.md
long_description_content_type = text/markdown
keywords = invenio rdm geographic leaflet
license = MIT
author = GEO Knowledge Hub community
author_email = pdsalvo@geosec.org
platforms = any
url = https://github.com/geo-knowledge-hub/invenio-geographic-components-react
classifiers =
    Development Status :: 5 - Production/Stable
    Environment :: Web Environment
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12

[options]
include_package_data = True
packages = find:

python_requires = >=3.9
zip_safe = False
install_requires =
    invenio-assets>=3.0.0,<5.0.0
    invenio-base>=1.3.0,<3.0.0
    invenio-i18n>=2.0.0,<4.0.0

[options.packages.find]
include = invenio_geographic_components*

[options.extras_require]
# pytest-invenio 2.x imports `pkg_resources` when the plugin loads, and setuptools
# stopped shipping it in 82.0.0, so pytest fails to start. The import is gone from 3.0.0.
tests =
    pytest-invenio>=3.0.0,<5.0.0
    invenio-app>=1.5.0,<3.0.0
    # `check-manifest --no-build-isolation` builds the sdist in this environment
    wheel>=0.40.0

[options.entry_points]
invenio_base.blueprints =
    invenio_geographic_components = invenio_geographic_components.views:create_blueprint
invenio_assets.webpack =
    invenio_geographic_components = invenio_geographic_components.webpack:theme

[tool:pytest]
addopts = --doctest-modules
testpaths = tests invenio_geographic_components
